# Publica la carpeta frontend/ en GitHub Pages (modo demostración, sin servidor).
# Requiere: Settings -> Pages -> Source: GitHub Actions.
name: Publicar demostración
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: inventaria/frontend
      - id: despliegue
        uses: actions/deploy-pages@v4
