# Levanta PostgreSQL + la aplicación (API y frontend) con un solo comando:
#     docker compose up --build
# Luego abre http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventaria
      POSTGRES_PASSWORD: inventaria
      POSTGRES_DB: inventaria
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventaria"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://inventaria:inventaria@db:5432/inventaria
      SECRET_KEY: cambia-esta-clave-en-produccion
      SEMBRAR_DEMO: "1"
    ports:
      - "8000:8000"

volumes:
  datos_pg:
